<style>
:root{
  --bg:#f6f3ec; --paper:#fffdf8; --ink:#1d1f23; --ink2:#4a4f57; --ink3:#8a8f96;
  --line:#e6e0d3; --line2:#efe9dd; --accent:#b8432f; --accent-soft:#f6e3dc;
  --teal:#1f6f6b; --teal-soft:#dcefed; --gold:#a8741a; --gold-soft:#f5ead2;
  --violet:#5b4b9a; --violet-soft:#e7e3f4; --gray-soft:#ecebe6;
  --mem-bg:#fbf4e4; --mem-line:#ecd9ad; --shadow:0 1px 2px rgba(40,30,10,.05),0 4px 18px rgba(40,30,10,.05);
  --known:#3d8b5a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16171a; --paper:#1d1f23; --ink:#ecebe7; --ink2:#b9bcc2; --ink3:#7d828a;
    --line:#2d3036; --line2:#26292e; --accent:#e2765f; --accent-soft:#3a2622;
    --teal:#5cc0b8; --teal-soft:#1d3433; --gold:#d9a548; --gold-soft:#352c1b;
    --violet:#a99be0; --violet-soft:#2a2640; --gray-soft:#2a2c31;
    --mem-bg:#2a2519; --mem-line:#4a3f26; --shadow:none; --known:#6cc28c;
  }
}
:root[data-theme="dark"]{
  --bg:#16171a; --paper:#1d1f23; --ink:#ecebe7; --ink2:#b9bcc2; --ink3:#7d828a;
  --line:#2d3036; --line2:#26292e; --accent:#e2765f; --accent-soft:#3a2622;
  --teal:#5cc0b8; --teal-soft:#1d3433; --gold:#d9a548; --gold-soft:#352c1b;
  --violet:#a99be0; --violet-soft:#2a2640; --gray-soft:#2a2c31;
  --mem-bg:#2a2519; --mem-line:#4a3f26; --shadow:none; --known:#6cc28c;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.6 "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif}
button,input{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* ---------- header ---------- */
header.hero{padding:44px 0 26px}
.eyebrow{letter-spacing:.18em;font-size:12px;color:var(--accent);font-weight:600}
h1{margin:6px 0 8px;font:700 40px/1.15 Georgia,"Songti SC","STSong","SimSun",serif;letter-spacing:.02em}
h1 em{font-style:normal;color:var(--accent)}
.sub{color:var(--ink2);max-width:640px;margin:0}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.install-btn{display:inline-flex;align-items:center;gap:6px;margin-top:12px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);
  border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer}
.install-btn svg{width:15px;height:15px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:120px;box-shadow:var(--shadow)}
.stat b{display:block;font:700 22px/1.2 Georgia,serif}
.stat span{font-size:12px;color:var(--ink3)}
.progress{height:6px;background:var(--line2);border-radius:99px;margin-top:8px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--known);border-radius:99px;transition:width .3s}

/* ---------- toolbar ---------- */
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:saturate(1.2) blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  transition:transform .25s ease}
/* 往下滚时整条顶栏滑出屏幕，往上滚或按 / 时回来：读词时屏幕上只剩单词 */
.bar.away{transform:translateY(-100%)}
.bar .wrap{padding-top:8px;padding-bottom:8px}
.panel{padding-top:2px}
.panel[hidden]{display:none}
.fbtn{height:40px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);
  border-radius:10px;padding:0 12px;cursor:pointer;color:var(--ink2);white-space:nowrap}
.fbtn svg{width:16px;height:16px}
.fbtn b{font-weight:600;color:var(--ink)}
.fbtn[aria-expanded="true"]{border-color:var(--ink);box-shadow:0 0 0 3px var(--line2)}
.fbtn span:not(:empty){background:var(--accent);color:#fff;border-radius:99px;padding:0 6px;font-size:12px;line-height:18px}
.row1{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{flex:1 1 240px;position:relative}
.search input{width:100%;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--paper);
  padding:0 12px 0 36px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search > svg{position:absolute;left:11px;top:11px;width:18px;height:18px;color:var(--ink3)}
.search input{padding-right:40px}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.search .clr{position:absolute;right:6px;top:6px;width:28px;height:28px;border:0;border-radius:50%;background:var(--line2);color:var(--ink2);
  display:none;place-items:center;cursor:pointer;padding:0}
.search .clr svg{width:14px;height:14px}
.search.has .clr{display:grid;animation:okPop .25s ease-out}
.search .clr:hover{background:var(--line);color:var(--ink)}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;cursor:pointer;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.row2{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chips .lbl{color:var(--ink3);margin-right:2px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:2px 11px;cursor:pointer;color:var(--ink2)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink2);user-select:none}
.toggle input{accent-color:var(--accent);width:15px;height:15px}
.letters{display:flex;gap:3px;flex-wrap:wrap;margin-top:10px}
.letters button{min-width:30px;height:28px;border:1px solid transparent;background:none;border-radius:7px;cursor:pointer;
  font:600 13px/1 Georgia,serif;color:var(--ink2);padding:0 6px}
.letters button:hover{border-color:var(--line);background:var(--paper)}
.letters button[aria-pressed="true"]{background:var(--accent);color:#fff}
.letters button small{display:none}
.cta{height:40px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:0 16px;cursor:pointer;font-weight:600;white-space:nowrap}
.cta.ghost{background:var(--paper);color:var(--accent)}
.cta span:not(:empty){margin-left:6px;background:#fff;color:var(--accent);border-radius:99px;padding:0 7px;font-size:12px}
/* ---------- study overlay ---------- */
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column}
.ov.show{display:flex;animation:ovIn .22s ease-out}
@keyframes ovIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.done-big{animation:donePop .5s cubic-bezier(.2,.9,.3,1.5)}
@keyframes donePop{0%{opacity:0;transform:scale(.85)}60%{opacity:1;transform:scale(1.04)}100%{transform:none}}
@media (prefers-reduced-motion: reduce){.ov.show,.done-big{animation:none}}
.ov-top{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ov-top .ttl{font-weight:700}
.ov-top .meta{color:var(--ink3);font-size:13px;flex:1}
.ov-close{border:1px solid var(--line);background:var(--paper);border-radius:9px;height:34px;padding:0 12px;cursor:pointer}
.ov-bar{height:4px;background:var(--line2)}
.ov-bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.ov-main{flex:1;overflow:auto;overflow-x:hidden;display:flex;justify-content:center;padding:28px 16px 40px}
.fc{width:100%;max-width:620px}
.fc-word{font:700 46px/1.15 Georgia,"Times New Roman",serif;text-align:center;margin:18px 0 6px;word-break:break-word}
.fc-sub{text-align:center;color:var(--ink3);font-size:13px;min-height:20px}
.fc-pic{text-align:center;font-size:44px;min-height:56px;margin:8px 0}
.fc-back{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-top:14px;box-shadow:var(--shadow)}
.fc-back .mean li{font-size:17px}
.fc-back .parts-d{justify-content:center;margin:12px 0 4px}
.fc-acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.fc-acts button{min-width:96px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-weight:600}
.fc-acts button small{display:block;font-weight:400;font-size:11px;color:var(--ink3);line-height:1}
.fc-acts .again{border-color:#d0574a;color:#d0574a}.fc-acts .hard{border-color:var(--gold);color:var(--gold)}
.fc-acts .good{border-color:var(--known);color:var(--known)}.fc-acts .easy{border-color:var(--teal);color:var(--teal)}
.fc-acts .primary{background:var(--ink);color:var(--paper);border-color:var(--ink);min-width:180px}
.fc-keys{text-align:center;color:var(--ink3);font-size:12px;margin-top:12px}
.opts{display:grid;gap:10px;margin-top:20px}
.opt{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 16px;cursor:pointer;font-size:16px}
.opt:hover{border-color:var(--ink3)}
.opt.right{border-color:var(--known);background:color-mix(in srgb,var(--known) 14%,var(--paper))}
.opt.wrong{border-color:#d0574a;background:color-mix(in srgb,#d0574a 12%,var(--paper))}
.spell{display:flex;gap:8px;margin-top:20px}
.spell button{flex:none;height:50px}
.spell input{flex:1 1 auto;min-width:0;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--paper);padding:0 16px;font:600 22px Georgia,serif;outline:none;text-align:center}
.spell input.right{border-color:var(--known)}.spell input.wrong{border-color:#d0574a}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:20px}
.mode{border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:16px;cursor:pointer;text-align:left}
.mode b{display:block;font-size:16px;margin-bottom:4px}.mode span{color:var(--ink3);font-size:13px}
.setrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;color:var(--ink2);font-size:14px}
.setrow input{height:34px;border-radius:8px;border:1px solid var(--line);background:var(--paper);padding:0 8px}
.done-big{font:700 30px/1.3 Georgia,serif;text-align:center;margin-top:30px}
.theme{border:1px solid var(--line);background:var(--paper);border-radius:10px;width:40px;height:40px;cursor:pointer;display:grid;place-items:center}
.theme svg{width:18px;height:18px}

/* ---------- list ---------- */
main{padding:18px 0 60px}
.resinfo{color:var(--ink3);font-size:13px;margin:4px 2px 12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.group{font:700 30px/1 Georgia,serif;color:var(--accent);margin:26px 4px 10px;display:flex;align-items:baseline;gap:10px}
.group small{font:13px/1 "PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink3);font-weight:400}
.list{display:grid;gap:10px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px 13px;box-shadow:var(--shadow);
  display:grid;grid-template-columns:minmax(150px,210px) 1fr 150px;gap:6px 18px;align-items:start;position:relative}
.card{transition:opacity .3s ease}
.card.known{opacity:.55}
.card.open .detail{animation:fcUp .22s ease-out}
body.simple .pgroup .pbody.open{animation:fcUp .22s ease-out}
.card.known .w{text-decoration:line-through;text-decoration-color:var(--known);text-decoration-thickness:2px}
.head{min-width:0}
.w{font:600 22px/1.25 Georgia,"Times New Roman",serif;word-break:break-word;letter-spacing:.01em}
.rank{font:12px/1 Georgia,serif;color:var(--ink3);margin-right:6px}
.badges{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.lv{font-size:11px;line-height:1;padding:4px 7px;border-radius:5px;font-weight:600;letter-spacing:.04em}
.lv.basic{background:var(--gray-soft);color:var(--ink2)}
.lv.cet4{background:var(--teal-soft);color:var(--teal)}
.lv.cet6{background:var(--accent-soft);color:var(--accent)}
.lv.ext{background:var(--violet-soft);color:var(--violet)}
.hot{font-size:11px;line-height:1;padding:4px 7px;border-radius:5px;background:var(--gold-soft);color:var(--gold);font-weight:600}
.body{min-width:0}
.mean{margin:0;padding:0;list-style:none}
.mean li{margin:0 0 2px;color:var(--ink)}
.pos{display:inline-block;min-width:36px;font:italic 13px/1.6 Georgia,serif;color:var(--ink3);margin-right:4px}
.mem{margin-top:8px;background:var(--mem-bg);border:1px solid var(--mem-line);border-radius:9px;padding:6px 10px 6px 34px;
  font-size:14px;color:var(--ink2);position:relative}
.mem::before{content:"记";position:absolute;left:8px;top:7px;width:19px;height:19px;border-radius:5px;background:var(--gold);color:#fff;
  font-size:12px;line-height:19px;text-align:center;font-weight:700}
.mem b{color:var(--ink);font-weight:600}
.pic{font-size:28px;line-height:1.2;margin-top:8px;letter-spacing:2px}
/* ---------- 词根算式卡：[前缀] + [词根] + [后缀] = 意思 ---------- */
.parts-d{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0 2px}
/* 词块像积木一样拼在一起：前一块的颜色在接缝处凸出一个圆榫，嵌进后一块 */
.wbar{display:inline-flex;align-items:stretch;flex-wrap:wrap;row-gap:4px}
.blk{--br:12px;position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;border-radius:var(--br);
  padding:7px 14px 6px;min-width:54px;opacity:0;transform:translate(var(--sx,0px),var(--sy,-12px)) scale(.9);
  box-shadow:inset 0 -2.5px 0 color-mix(in srgb,currentColor 22%,transparent);cursor:pointer;transition:transform .15s,box-shadow .15s}
.wbar>.blk{border-radius:4px}
.wbar>.blk:first-child{border-radius:var(--br) 4px 4px var(--br)}
.wbar>.blk:last-child{border-radius:4px var(--br) var(--br) 4px}
.wbar>.blk:only-child{border-radius:var(--br)}
.wbar>.blk+.blk{margin-left:3px}
.wbar>.blk+.blk::before{content:"";position:absolute;left:-8px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;transform:scale(0)}
.wbar>.blk.pre+.blk::before{background:var(--teal-soft)}
.wbar>.blk.root+.blk::before{background:var(--accent-soft)}
.wbar>.blk.suf+.blk::before{background:var(--violet-soft)}
.blk:hover{transform:translateY(-2px)!important;box-shadow:inset 0 -2.5px 0 color-mix(in srgb,currentColor 22%,transparent),0 4px 12px rgba(0,0,0,.12)}
.in .blk{animation:snap .5s cubic-bezier(.25,1.35,.5,1) forwards;animation-delay:var(--d)}
@keyframes snap{to{opacity:1;transform:none}}
.in .wbar{animation:snapBump .35s ease-out both;animation-delay:var(--t)}
@keyframes snapBump{0%,100%{transform:none}40%{transform:scale(1.045)}}
.in .wbar>.blk+.blk::before{animation:tabIn .3s cubic-bezier(.3,1.6,.5,1) forwards;animation-delay:var(--t)}
@keyframes tabIn{to{transform:scale(1)}}
@keyframes drop{to{opacity:1;transform:none}}
.blk i{font-style:normal;font-size:10px;letter-spacing:.12em;opacity:.75;line-height:1;margin-bottom:3px}
.blk b{font:700 19px/1.2 Georgia,"Times New Roman",serif;letter-spacing:.03em}
.blk em{font-style:normal;font-size:12px;line-height:1.35;margin-top:2px;font-weight:600}
.blk.pre{background:var(--teal-soft);color:var(--teal)}
.blk.root{background:var(--accent-soft);color:var(--accent)}
.blk.suf{background:var(--violet-soft);color:var(--violet)}
.plus,.eq{align-self:center;color:var(--ink3);font:600 15px/1 Georgia,serif;opacity:0}
.in .plus,.in .eq{animation:fade .3s forwards;animation-delay:var(--d)}
@keyframes fade{to{opacity:1}}
.res{align-self:center;display:inline-flex;align-items:center;border-radius:11px;padding:8px 13px;background:var(--ink);color:var(--paper);
  font-weight:700;font-size:15px;opacity:0;transform:scale(.6)}
.in .res{animation:pop .45s cubic-bezier(.2,.9,.3,1.5) forwards;animation-delay:var(--d)}
@keyframes pop{to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.blk,.plus,.eq,.res{opacity:1;transform:none}.in .blk,.in .plus,.in .eq,.in .res,.in .wbar{animation:none}.wbar>.blk+.blk::before{transform:none}}
.legend-role{display:inline-flex;gap:6px;align-items:center;margin-left:6px}
.legend-role span{font-size:11px;padding:2px 7px;border-radius:6px;font-weight:600}
/* ---------- 词根视图 ---------- */
.roots-sec h2{font:700 18px/1.3 "PingFang SC","Microsoft YaHei",sans-serif;margin:24px 4px 10px;display:flex;gap:8px;align-items:baseline}
.roots-sec h2 small{font-weight:400;font-size:13px;color:var(--ink3)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.rcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.rcard .rh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.rcard .rh .blk{opacity:1;transform:none;cursor:default}
.rcard .rh span{color:var(--ink3);font-size:12px}
.rcard .rw{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:14px}
.rcard .rw a{color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--ink3);cursor:pointer}
.rcard .rw a small{color:var(--ink3);margin-left:3px;font-size:11px}
.rcard .more-w{color:var(--accent);cursor:pointer;font-size:12px;border:0;background:none;padding:0}
.vs{margin-top:6px;font-size:13px;color:var(--ink2)}
.vs u.df{text-decoration:none;color:#fff;background:var(--accent);border-radius:3px;padding:0 1px;margin:0 .5px;font-weight:700}
.vs .vsw{font-weight:600;color:var(--ink)}
.flow-back{min-height:150px;width:100%}
.story{margin-top:6px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:6px 10px 7px;background:var(--paper);font-size:13px;line-height:1.6}
.story .st-h{display:flex;flex-wrap:wrap;align-items:center;gap:2px 5px;font:600 14px/1.4 Georgia,serif}
.story .st-h span{font:600 11px/1.6 system-ui,sans-serif;background:var(--accent);color:#fff;border-radius:4px;padding:0 6px;margin-right:4px}
.story .st-h i{color:var(--ink3);font-style:normal;font-weight:400}

/* ===== 手感：按下回弹、焦点环、翻卡、答题反馈 ===== */
button,.chip,.opt,.mode,.ib,.cta,.fbtn,.more,.theme,.top,.ov-close,.parts-tog,.anim-btn,.letters button,.seg button{
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  transition:transform .14s cubic-bezier(.2,.8,.3,1.3),background-color .15s,border-color .15s,box-shadow .15s,color .15s}
button:active,.chip:active,.opt:active,.mode:active,.ib:active,.cta:active,.fbtn:active,.more:active,.theme:active,.top:active,
.ov-close:active,.parts-tog:active,.anim-btn:active,.letters button:active,.seg button:active{transform:scale(.95);transition-duration:.06s}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.search input:focus-visible,.spell input:focus-visible{outline:none}
.ib.on{animation:okPop .35s cubic-bezier(.2,.9,.3,1.6)}
@media (hover:hover){
  .card{transition:border-color .18s,box-shadow .2s,opacity .3s ease}
  .card:hover{border-color:color-mix(in srgb,var(--ink3) 40%,var(--line))}
  .mode:hover{border-color:var(--ink3);transform:translateY(-2px);box-shadow:var(--shadow)}
  .cta:hover{filter:brightness(1.07)}
  .chip:hover,.fbtn:hover,.ov-close:hover,.theme:hover,.more:hover{border-color:var(--ink3)}
  .fc-acts button:hover{transform:translateY(-1px)}
  .fc-acts .again:hover{background:color-mix(in srgb,#d0574a 12%,var(--paper))}
  .fc-acts .hard:hover{background:color-mix(in srgb,var(--gold) 12%,var(--paper))}
  .fc-acts .good:hover{background:color-mix(in srgb,var(--known) 12%,var(--paper))}
  .fc-acts .easy:hover{background:color-mix(in srgb,var(--teal) 12%,var(--paper))}
}
/* 背诵卡：换卡时单词淡入，看答案时背面从下方滑上来 */
.fc{position:relative;touch-action:pan-y;will-change:transform}
.fc-word{animation:fcIn .28s ease-out}
.fc-back{animation:fcUp .32s cubic-bezier(.2,.8,.3,1)}
@keyframes fcIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fcUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* 答对轻轻一弹，答错左右一抖 */
.opt.right,.spell input.right{animation:okPop .38s cubic-bezier(.2,.9,.3,1.5)}
.opt.wrong,.spell input.wrong{animation:noShake .4s}
@keyframes okPop{0%{transform:scale(1)}45%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes noShake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
/* 手机上拖动背诵卡：左滑忘了（红）、右滑记得（绿） */
.fc.dragging{transition:none}
.fc.settle{transition:transform .25s cubic-bezier(.2,.8,.3,1.2)}
.fc.flyL,.fc.flyR{transition:transform .22s ease-in,opacity .22s;opacity:0}
.fc.flyL{transform:translateX(-120%) rotate(-10deg)!important}
.fc.flyR{transform:translateX(120%) rotate(10deg)!important}
.fc[data-dir="L"] .fc-back{border-color:#d0574a;box-shadow:0 0 0 3px color-mix(in srgb,#d0574a 25%,transparent)}
.fc[data-dir="R"] .fc-back{border-color:var(--known);box-shadow:0 0 0 3px color-mix(in srgb,var(--known) 25%,transparent)}
.fc[data-dir]:not([data-dir=""])::before{position:absolute;top:6px;font:700 15px/1 system-ui,sans-serif;padding:7px 12px;border-radius:9px;color:#fff;z-index:2}
.fc[data-dir="L"]::before{content:"忘了";right:6px;background:#d0574a}
.fc[data-dir="R"]::before{content:"记得";left:6px;background:var(--known)}
.fc[data-dir="next"]::before{content:"下一个 →";right:6px;background:var(--ink2)}
.fc[data-dir="prev"]::before{content:"← 上一个";left:6px;background:var(--ink2)}
#nx.auto{position:relative;overflow:hidden}
#nx.auto::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--accent);animation:autoBar var(--auto,1.2s) linear forwards}
@keyframes autoBar{to{width:100%}}
.swipe-help{display:none;text-align:center;color:var(--ink3);font-size:12px;margin-top:10px}
@media (hover:none) and (pointer:coarse){.swipe-help{display:block}}
@media (prefers-reduced-motion: reduce){
  .fc-word,.fc-back,.opt.right,.opt.wrong,.spell input.right,.spell input.wrong,.ib.on{animation:none}
  button:active,.chip:active,.opt:active,.mode:active,.ib:active,.cta:active{transform:none}
}

.cover .card.reveal .body .mean, .cover .card.reveal .body .mem{filter:none}

.card .freq{padding-bottom:34px}

  box-shadow:var(--shadow);cursor:pointer;display:none;place-items:center;z-index:30}
.top.show{display:grid}
/* ===== 词根动画 ===== */
.parts-tog{display:none;border:1px dashed var(--line);background:none;color:var(--ink3);border-radius:8px;font-size:12px;padding:2px 9px;margin:6px 0 0;cursor:pointer}

.ptabs{display:flex;flex-wrap:wrap;gap:6px}

.fc-back .pgroup{text-align:center}

.anim-btn{border:1px dashed var(--line);background:none;color:var(--ink3);border-radius:8px;font-size:12px;padding:3px 9px;cursor:pointer;align-self:center;margin-left:4px}

.anim-strip{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px 6px;margin:8px 0 2px;padding:12px;border-radius:14px;background:var(--line2)}
.anim-tile{display:flex;flex-direction:column;align-items:center;gap:3px;opacity:0;transform:translateY(10px) scale(.6);animation:tileIn .5s cubic-bezier(.2,.9,.3,1.4) forwards;animation-delay:var(--d)}
@keyframes tileIn{to{opacity:1;transform:none}}
.anim-tile svg{width:68px;height:68px;border-radius:18px;background:var(--paper);overflow:hidden;
  box-shadow:0 0 0 1.5px color-mix(in srgb,currentColor 30%,transparent),0 4px 12px -6px color-mix(in srgb,currentColor 60%,transparent)}

.anim-tile.pre{color:var(--teal)} .anim-tile.root{color:var(--accent)} .anim-tile.suf{color:var(--violet)}
.anim-tile.pre em{background:var(--teal-soft)} .anim-tile.root em{background:var(--accent-soft)} .anim-tile.suf em{background:var(--violet-soft)}

  animation:resIn .6s cubic-bezier(.2,.9,.3,1.5) forwards,resGlow 1s ease-out forwards;animation-delay:var(--d),calc(var(--d) + .35s);
  background:var(--paper);color:var(--ink);border:2px solid var(--ink);font-weight:700;border-radius:14px;padding:5px 14px 7px;font-size:17px;line-height:1.3}

.anim-res .r-pre{color:var(--teal)} .anim-res .r-root{color:var(--accent)} .anim-res .r-suf{color:var(--violet)}
@keyframes resIn{0%{opacity:0;transform:scale(.5)}60%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:none}}
@keyframes resGlow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}100%{box-shadow:0 0 0 14px transparent}}

/* 画面里的配色：ff 实心主色、sf 浅色填充、pf 纸色（眼睛高光）、mu / mf 灰色参照物 */
.anim-tile svg *{transform-box:fill-box;transform-origin:center}
.anim-tile svg [transform]{transform-box:view-box;transform-origin:0 0}
.anim-tile svg .ff{fill:currentColor;stroke:none}
.anim-tile svg .sf{fill:currentColor;fill-opacity:.18}
.anim-tile svg .pf{fill:var(--paper)}
.anim-tile svg .mu{stroke:var(--ink3);opacity:.6}
.anim-tile svg .mf{fill:var(--ink3);opacity:.28;stroke:none}
.anim-tile svg .mute .ff{fill:var(--ink3)}
.anim-tile svg text.ff{stroke:none}
/* 通用动作：起点 (x0,y0,r0,s0) → 终点 (x1,y1,r1,s1)，在 16%→58% 之间走完，停到 86% 再淡出 */

  58%,86%{opacity:1;transform:translate(var(--x1,0px),var(--y1,0px)) rotate(var(--r1,0deg)) scale(var(--s1,1))}
  100%{opacity:0;transform:translate(var(--x1,0px),var(--y1,0px)) rotate(var(--r1,0deg)) scale(var(--s1,1))}}

    <p class="sub" id="sub">近六年 13 次真题逐词统计频率，只留考试常考的意思。每个词都有助记：词根积木和动画、形近词和翻译话题串记、熟词僻义标注、写作翻译搭配。可以按字母、真题频率、会写词汇、词根、串记浏览，配间隔复习背诵和四种自测。</p>
    <button class="install-btn" id="installBtn" hidden title="装到手机桌面，像 App 一样全屏打开，断网也能用"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>安装到手机桌面</button>

      </label>
      <button class="cta" id="studyBtn" title="间隔复习背单词">背诵<span id="dueBadge"></span></button>
      <button class="cta ghost" id="quizBtn" title="选择题 / 拼写 / 听音自测">自测</button>

      <label class="toggle" title="翻译题常用的中国文化、社会热点词，如 acupuncture 针灸、terracotta 兵马俑、e-commerce 电商"><input type="checkbox" id="topicOnly">只看翻译话题词</label>

window.CET6 = {

<script src="data/core.js?v=c4e45f83"></script>
<script>
(function(){
  'use strict';
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const store = {
    get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
    set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  };
  const meta = CET6.info || {years:[2021,2022,2023,2024,2025,2026], sittings:[]};
  const YEARS = meta.years;
  // row: [w, zh[[pos,text]], mem, lv, n, s, y[], pt[], band, rank]
  // 线上版分两步加载：先到的 core 只有单词、释义、词根（够先显示列表），助记 / 易混 / 逐年次数随后由 extra 补上
  const words = CET6.rows.map(r => ({w:r[0], zh:r[1], mem:r[2]||'', lv:r[3], n:r[4], s:r[5], y:r[6]||[0,0,0,0,0,0], pt:r[7]||[0,0,0,0,0], b:r[8], r:r[9],
    parts:r[10]||null, pic:r[11]||'', vs:r[12]||'', wr:!!r[13], rs:!!r[14]}));
  // 写作+翻译部分出现次数，用于「会写词汇」排序
  for (const w of words) w.wt = ((w.pt||[])[2]||0) + ((w.pt||[])[3]||0);
  const byWord = new Map(words.map(w => [w.w, w]));
  /* 词根词缀角色：用于给积木上色、建立同根词索引 */
  const PREFIX = new Set(('a ab abs ad ac af ag al an ap ar as at ante anti auto be bene bi by circum co col com con cor contra counter de dia dis di dif e ec en em ex extra fore hyper hypo il im in ir inter intro mal micro mis mono multi non ob oc of op out over para per post pre pro re retro se semi sub suc suf sup sur super sus sym syn tele trans tri ultra un under uni up with').split(' '));
  const SUFFIX = new Set(('r d n s y t e es ty ier ery ory ure ual ian ese ary ory ics ology logy graphy eer ette let ling ster ward wards wise itude tude ture iety ety acy ency ancy ient ier ator itor ative itive ation ition ization ism ist ally ily ingly edly ise ize ify fy en ed er or ess ful ness ment ship hood dom able ible al ial ance ence ancy ency ant ent ar ary ery ory ate ative itive cy dom ed ee eer en er or ess est ful fy ify hood ic ical ics ion tion sion ation ish ism ist ity ty ive ize ise less let ly ment ness ous ious eous ship some ure ture ward wise y ing age al ism th ster ling ite').split(' '));
  function role(seg, i, n){
    const s = seg.toLowerCase();
    if (n > 1 && i === 0 && PREFIX.has(s)) return 'pre';
    if (n > 1 && i === n - 1 && SUFFIX.has(s)) return 'suf';
    return 'root';
  }
  /* 同根词索引：同一个词根（非词缀、≥3 字母、含义相同）出现在多个词里 */
  // 同根词索引：同一个拼写可能是不同的词根（vision 的 vis「看」≠ division 的 vis「分」），所以按「拼写 + 意思首字」分开
  const rootIdx = new Map();
  const rootKey = (seg, m) => seg.toLowerCase() + '|' + String(m || '').replace(/^[…\s（(]+/, '').charAt(0);
  for (const w of words) {
    if (!w.parts) continue;
    w.parts.forEach(([seg, m], i) => {
      if (role(seg, i, w.parts.length) !== 'root' || seg.length < 3 || seg.toLowerCase() === w.w) return;
      const k = rootKey(seg, m);
      if (!rootIdx.has(k)) rootIdx.set(k, {m, ws: []});
      rootIdx.get(k).ws.push(w.w);
    });
  }
  const LV = {basic:'基础', cet4:'四级', cet6:'六级', ext:'超纲'};
  const BAND = {4:'必考', 3:'高频', 2:'常见', 1:'偶考', 0:'未考'};
  // 合并了英美拼法后，旧进度里记的是另一种拼法（behaviour）：换成现在的词条（behavior）
  const ALIAS = meta.alias || {};
  const TOPICS = new Set(meta.topics || []);   // 翻译话题词：中国文化、社会热点（真题翻译给中文，英文里多为 0 次）
  const known = new Set(store.get('cet6-known', []).map(w => ALIAS[w] || w));
  const st = Object.assign({sort:'alpha', lv:'all', band:'all', letter:'all', q:'', cover:false, hideKnown:false, simple:true}, store.get('cet6-view', {}));
  document.body.classList.toggle('simple', st.simple);
  st.q = '';
  const PAGE = 120;
  let shown = 0, current = [];

  /* ---------- header stats ---------- */
  function renderStats(){
    const nS = (meta.sittings||[]).length;
    const html = [
      ['总词数', words.length.toLocaleString()],
      ['统计考次', nS ? nS + ' 次' : '—'],
      ['覆盖年份', YEARS[0] + '–' + YEARS[YEARS.length-1]],
    ].map(([a,b]) => `<div class="stat"><b>${b}</b><span>${a}</span></div>`).join('')
      + `<div class="stat" style="min-width:180px"><b id="knownN">0</b><span>已掌握</span><div class="progress"><i id="knownBar"></i></div></div>`;
    $('#stats').innerHTML = html;
    updateKnown();
  }
  function updateKnown(){
    const n = words.filter(w => known.has(w.w)).length;
    const el = $('#knownN'); if (!el) return;
    el.textContent = n.toLocaleString() + ' / ' + words.length.toLocaleString();
    $('#knownBar').style.width = (words.length ? n / words.length * 100 : 0) + '%';
  }

  /* ---------- controls ---------- */
  function chip(container, key, val, label){
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = label; b.dataset.v = val;
    b.setAttribute('aria-pressed', String(st[key] === val));
    b.onclick = () => { st[key] = val; container.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.v === val))); apply(); };
    container.appendChild(b);
  }
  function buildControls(){
    const lvc = $('#lvChips');

      <p><b>词频来源</b>：统计了 ${nS} 次六级考试的真题文本（${sitList || '—'}），包括听力原文、阅读、写作题目和翻译参考译文，词形变化（复数、过去式、比较级等）合并到原形计数。“次”指该词在全部真题中出现的总次数，柱状图是 ${YEARS[0]}–${YEARS[YEARS.length-1]} 年逐年次数。</p>
      <p><b>频率分档</b>：必考 = 在 70% 以上的考次中出现；高频 = 40% 以上；常见 = 至少出现在 2 次考试；偶考 = 只出现在 1 次考试；未考 = 近六年真题中没出现。</p>
      <p><b>级别</b>：基础 = 中学阶段词汇；四级 / 六级 = 四六级考纲词汇；超纲 = 考纲外但在真题中出现过的词。</p>
      <p><b>释义与助记</b>：释义只保留考试常考的意思；助记优先用词根词缀拆解，其次是熟词联想、形近词对比和谐音，仅用于帮助记忆，不一定是严格的词源。串记段子和搭配均为本站原创编写。</p>
      <p><b>词典底表</b>：词条与级别标签来自开源词典 ECDICT（MIT 协议）。真题原文不收录在本文件中。</p>
      <p style="color:var(--ink3)">生成日期：${meta.generated || '—'}</p>`;
  }

  /* =====================================================================
     背诵模式：间隔重复（简化 SM-2）
     srs[word] = {e: 难度系数, i: 间隔天数, r: 连续记住次数, due: 下次复习时间戳, l: 遗忘次数}
     ===================================================================== */
  const DAY = 864e5;
  const srs = store.get('cet6-srs', {});
  for (const [old, now] of Object.entries(ALIAS)) if (srs[old]) { if (!srs[now] || srs[now].i < srs[old].i) srs[now] = srs[old]; delete srs[old]; }
  const plan = Object.assign({daily: 40, exam: ''}, store.get('cet6-plan', {}));
  const today0 = () => { const d = new Date(); d.setHours(0,0,0,0); return +d; };
  const newToday = () => { const o = store.get('cet6-newlog', {}); return o.d === today0() ? o.n : 0; };
  const bumpNew = () => { store.set('cet6-newlog', {d: today0(), n: newToday() + 1}); };
  const saveSrs = () => store.set('cet6-srs', srs);
  const dueList = () => Object.keys(srs).filter(w => byWord.has(w) && srs[w].due <= Date.now() + 60e3);
  function updateDue(){ const n = dueList().length; $('#dueBadge').textContent = n ? n : ''; }
  /* 打卡记录：每天评过多少个词 { 'YYYY-MM-DD': n } */
  const dayKey = (t = Date.now()) => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const daylog = store.get('cet6-daylog', {});
  function logReview(){ const k = dayKey(); daylog[k] = (daylog[k] || 0) + 1; store.set('cet6-daylog', daylog); }
  function streak(){
    let n = 0, t = Date.now();
    if (!daylog[dayKey(t)]) t -= DAY;            // 今天还没背也不算断
    while (daylog[dayKey(t)]) { n++; t -= DAY; }
    return n;
  }
  const sk2 = () => { const n = streak(); return n ? `已连续打卡 ${n} 天。` : ''; };
  function weekHtml(){
    const days = [...Array(7)].map((_, i) => { const t = Date.now() - (6 - i) * DAY; return {k: dayKey(t), n: daylog[dayKey(t)] || 0, d: '日一二三四五六'[new Date(t).getDay()]}; });
    const max = Math.max(10, ...days.map(d => d.n));
    return `<div style="display:flex;gap:8px;justify-content:center;align-items:flex-end;height:70px;margin:14px 0 4px">${days.map(d =>
      `<div style="display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--ink3)"><span>${d.n || ''}</span><i style="display:block;width:22px;border-radius:4px 4px 0 0;background:${d.n ? 'var(--accent)' : 'var(--line)'};height:${d.n ? Math.max(4, Math.round(d.n / max * 44)) : 3}px"></i><span>${d.d}</span></div>`).join('')}</div>`;
  }
  function grade(w, q){ // q: 0 忘了 1 模糊 2 记得 3 太简单
    logReview();
    const s = srs[w] || {e:2.5, i:0, r:0, due:0, l:0};
    if (q === 0) { s.r = 0; s.l++; s.i = 0; s.e = Math.max(1.3, s.e - .2); s.due = Date.now() + 60e3; }
    else {
      if (q === 1) { s.i = Math.max(1, s.i * 1.2); s.e = Math.max(1.3, s.e - .15); }
      else if (s.r === 0) s.i = q === 3 ? 4 : 1;
      else if (s.r === 1) s.i = q === 3 ? 7 : 3;
      else s.i = s.i * s.e * (q === 3 ? 1.3 : 1);
      if (q === 3) s.e += .15;
      s.r++; s.i = Math.min(s.i, 180);
      s.due = today0() + Math.round(s.i) * DAY + 4 * 36e5;
    }
    srs[w] = s; saveSrs();
    if (s.i >= 21 && !known.has(w)) { known.add(w); store.set('cet6-known', [...known]); updateKnown(); }
    updateDue();
  }
  const ov = $('#ov'), fc = $('#fc');
  let session = null;
  function openOv(title){ $('#ovTitle').textContent = title; ov.classList.add('show'); document.body.style.overflow = 'hidden'; }
  function closeOv(){ flowStop(); ov.classList.remove('show'); document.body.style.overflow = ''; session = null; updateDue(); apply(); }
  $('#ovClose').onclick = closeOv;
  // 手机震动反馈（支持的安卓浏览器才有；iPhone 和电脑上自动无效）
  const buzz = p => { try { if (navigator.vibrate) navigator.vibrate(p); } catch(e){} };
  function speak(w){ try { const u = new SpeechSynthesisUtterance(w); u.lang = 'en-US'; u.rate = .85; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch(e){} }
  const meanHtml = w => `<ul class="mean">${w.zh.map(([p,t]) => `<li>${p ? `<span class="pos">${esc(p)}</span>` : ''}${esc(t)}</li>`).join('')}</ul>`;
  function backHtml(w){
    return `<div class="fc-back in">${meanHtml(w)}${pgroup(w, w.parts ? animBlockHtml(w).replace(/<button class="anim-replay"[^>]*>.*?<\/button>/, '') : '', w.vs ? `<div class="vs"><span>易混</span>${vsBody(w, false)}</div>` : '', storyHtml(w, false))}${(synHtml(w) + familyHtml(w)).replace(/<a href="#" data-go="[^"]*"[^>]*>([^<]*)<\/a>/g, '$1')}</div>`;
  }
  function pool(){ // 当前筛选范围（不含已掌握）
    const base = current.length ? current : words;
    return base.filter(w => !known.has(w.w));
  }
  function daysLeft(){ if (!plan.exam) return 0; return Math.max(0, Math.ceil((new Date(plan.exam) - today0()) / DAY)); }

  // 每天一组串记段子：按日期挑一组（同一天看到的是同一组），先笑一下再开始背
  function dailyStoryHtml(){
    const list = window.CET6.storyList || [];
    if (!list.length) return '';
    const d = Math.floor(today0() / DAY);
    const s = list[(d * 7919) % list.length];
    const w = byWord.get(s.ws.find(x => byWord.has(x)));
    return w ? `<div class="daily-st"><div class="fc-sub" style="margin:0 0 4px">今日串记</div>${storyHtml(w, false).replace(/<b class="st-me">/, '<b class="st-w">')}</div>` : '';
  }
  function studyHome(){
    openOv('背诵');
    const due = dueList().length, nt = newToday();
    const left = words.length - known.size, dl = daysLeft();
    const suggest = dl ? Math.ceil(left / Math.max(1, dl - 7)) : 0;
    $('#ovMeta').textContent = '';
    $('#ovBar').style.width = '0';
    const sk = streak(), learned = Object.keys(srs).length;
    fc.innerHTML = `
      <div class="done-big">今天：复习 ${due} 个 · 新词 ${Math.max(0, plan.daily - nt)} 个</div>
      <p class="fc-sub" style="margin-top:8px">${sk ? `已连续打卡 <b>${sk}</b> 天` : '今天开始第一天打卡'} · 学过 <b>${learned.toLocaleString()}</b> 词 · 已掌握 <b>${known.size.toLocaleString()}</b> 词</p>
      ${weekHtml()}
      ${dailyStoryHtml()}
      <p class="fc-sub" style="margin-top:10px">新词取自当前列表的顺序（${esc($('#resinfo').textContent)}）${st.lv === 'all' ? '，已跳过中学基础词' : ''}。<br>想先背高频词，就先切到「真题频率」排序再点背诵；只背会写词就切到「会写词汇」；专攻熟词僻义就在筛选里勾选「只看熟词僻义」，备考翻译就勾选「只看翻译话题词」。</p>
      <div class="setrow" style="justify-content:center">每天新词 <input id="pDaily" type="number" min="5" max="500" value="${plan.daily}" style="width:80px">
        考试日期 <input id="pExam" type="date" value="${esc(plan.exam)}"></div>
      <p class="fc-sub">${dl ? `距考试 ${dl} 天，还没掌握 ${left.toLocaleString()} 词；留一周冲刺的话，建议每天新词 ≈ <a class="go" id="useSug">${suggest}</a>` : '填上考试日期，会自动算每天该背多少'}</p>
      <div class="fc-acts"><button class="primary" id="goStudy">开始<span class="kh">（Enter）</span></button><button id="goFlow" title="自动播放当前列表：看词 → 听音 → 出意思和助记，不打分">快速过词（自动播放）</button>${hardWords().length ? `<button id="goHard" title="忘过 2 次以上的词，集中再过一遍">专攻易忘词（${hardWords().length}）</button>` : ''}</div>
      <div class="fc-keys">背的时候：空格 = 看答案，1 忘了 · 2 模糊 · 3 记得 · 4 太简单。忘了的词这一轮会再出现，直到记住。</div>
      <div class="fc-acts" style="margin-top:18px"><button id="expP" title="把进度存成文件，换设备时导入">导出进度</button><button id="impP">导入进度</button><input type="file" id="impF" accept=".json,application/json" hidden></div>
      <p class="fc-sub" id="pMsg">进度只保存在这个浏览器里；换手机、换电脑或清缓存前，先导出备份。</p>`;
    $('#expP').onclick = exportProgress;
    $('#impP').onclick = () => $('#impF').click();
    $('#impF').onchange = e => importProgress(e.target.files[0]);
    $('#pDaily').onchange = e => { plan.daily = Math.max(5, +e.target.value || 40); store.set('cet6-plan', plan); studyHome(); };
    $('#pExam').onchange = e => { plan.exam = e.target.value; store.set('cet6-plan', plan); studyHome(); };
    const us = $('#useSug'); if (us) us.onclick = () => { plan.daily = suggest; store.set('cet6-plan', plan); studyHome(); };
    $('#goStudy').onclick = startStudy;
    $('#goFlow').onclick = startFlow;
    const gh = $('#goHard'); if (gh) gh.onclick = startHard;
  }
  /* 进度备份：导出 / 导入（掌握标记、复习排程、打卡、计划） */
  const PROGRESS_KEYS = ['cet6-known', 'cet6-srs', 'cet6-daylog', 'cet6-plan', 'cet6-newlog'];
  function exportProgress(){
    const data = {app: 'cet6-8000', version: 1, exported: new Date().toISOString(), data: {}};
    for (const k of PROGRESS_KEYS) data.data[k] = store.get(k, null);
    const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `六级8000词-进度-${dayKey()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    const m = $('#pMsg'); if (m) m.textContent = `已导出：学过 ${Object.keys(srs).length} 词、已掌握 ${known.size} 词。`;
  }
  function importProgress(file){
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      const m = $('#pMsg');
      try {
        const obj = JSON.parse(r.result);
        if (!obj || obj.app !== 'cet6-8000' || !obj.data) throw new Error('不是本词表导出的进度文件');
        const nSrs = Object.keys(obj.data['cet6-srs'] || {}).length;
        if (!confirm(`导入后会覆盖当前进度（文件里学过 ${nSrs} 词）。继续？`)) return;
        for (const k of PROGRESS_KEYS) if (obj.data[k] != null) store.set(k, obj.data[k]);
        location.reload();
      } catch (err) { if (m) m.textContent = '导入失败：' + err.message; }
    };
    r.readAsText(file);
  }
  // 易忘词：被评「忘了」2 次以上，且还没掌握（间隔 < 21 天）
  const hardWords = () => Object.keys(srs).filter(w => byWord.has(w) && srs[w].l >= 2 && srs[w].i < 21)
    .sort((a, b) => srs[b].l - srs[a].l).map(w => byWord.get(w));
  function startHard(){
    const q = hardWords().slice(0, 30).map(w => ({w, isNew: false}));
    if (!q.length) return;
    session = {q, idx: 0, total: q.length, done: 0, shown: false};
    $('#ovTitle').textContent = '专攻易忘词';
    showCard();
  }
  /* 快速过词：自动播放，像刷短视频一样一遍遍过，不打分、不考——先混个脸熟，再进背诵 */
  const FLOW_SPEED = {slow: [2200, 4200], mid: [1400, 3000], fast: [800, 1800]};
  const FLOW_ZH = {slow: '慢', mid: '中', fast: '快'};
  function startFlow(){
    const list = pool().filter(w => st.lv !== 'all' || w.lv !== 'basic'); // 同背诵：「全部」时跳过中学基础词
    if (!list.length) return;
    const last = store.get('cet6-flow-last', '');
    const at = Math.max(0, list.findIndex(w => w.w === last));
    session = {flow: true, q: list, idx: at, paused: false, speed: store.get('cet6-flow-speed', 'mid'), timer: 0, seen: 0};
    $('#ovTitle').textContent = '快速过词';
    flowCard();
  }
  function flowStop(){ const s = session; if (s && s.flow) clearTimeout(s.timer); }
  function flowCard(){
    const s = session; if (!s || !s.flow) return;
    clearTimeout(s.timer);
    if (s.idx >= s.q.length) { fc.innerHTML = `<div class="done-big">这一串过完了</div><p class="fc-sub">一共过了 ${s.seen} 个词。混个脸熟之后，去「背诵」里打分记牢。</p><div class="fc-acts"><button class="primary" id="flowAgain">从头再过一遍</button></div>`; $('#flowAgain').onclick = () => { store.set('cet6-flow-last', ''); startFlow(); }; $('#ovBar').style.width = '100%'; return; }
    const w = s.q[s.idx];
    store.set('cet6-flow-last', w.w);
    $('#ovMeta').textContent = `第 ${(s.idx + 1).toLocaleString()} / ${s.q.length.toLocaleString()} 个 · ${LV[w.lv]} · 真题 ${w.n} 次`;
    $('#ovBar').style.width = (s.idx / s.q.length * 100) + '%';
    fc.innerHTML = `<div class="fc-word">${esc(w.w)}</div><div id="flowBack" class="flow-back"></div>
      <div class="fc-acts flow-acts"><button id="fPrev" title="上一个（←）">←</button><button class="primary" id="fPlay">${s.paused ? '▶ 继续' : '❚❚ 暂停'}<span class="kh">（空格）</span></button><button id="fNext" title="下一个（→）">→</button>
        <button id="fSpeed" title="切换速度">速度：${FLOW_ZH[s.speed]}</button><button id="fKnow" title="已经会了，以后不再出现（K）">会了 ✓<span class="kh">（K）</span></button></div>
      <div class="fc-keys">自动播放：先看词、听发音，自己想一下，意思和助记随后出现。← → 前后翻，K 标为已掌握。</div>
      <div class="swipe-help">左滑下一个 · 右滑上一个 · 轻点卡片暂停 / 继续</div>`;
    $('#fPrev').onclick = () => flowGo(-1);
    $('#fNext').onclick = () => flowGo(1);
    $('#fPlay').onclick = flowToggle;
    $('#fSpeed').onclick = () => { s.speed = s.speed === 'mid' ? 'fast' : s.speed === 'fast' ? 'slow' : 'mid'; store.set('cet6-flow-speed', s.speed); $('#fSpeed').textContent = '速度：' + FLOW_ZH[s.speed]; };
    $('#fKnow').onclick = flowKnow;
    if (!s.paused) { speak(w.w); s.seen++; }
    const [t1, t2] = FLOW_SPEED[s.speed];
    const showBack = () => {
      const b = $('#flowBack'); if (!b || b.dataset.on) return;
      b.dataset.on = '1';
      b.innerHTML = `<div class="fc-back in">${meanHtml(w)}${pgroup(w, w.parts ? `<div class="in" style="display:flex;justify-content:center">${partsHtml(w, {noResult: true})}</div>` : '', w.vs ? `<div class="vs"><span>易混</span>${vsBody(w, false)}</div>` : '', storyHtml(w, false))}</div>`;
    };
    if (s.paused) { showBack(); return; }
    s.timer = setTimeout(() => {
      showBack();
      // 助记越长，停得越久
      s.timer = setTimeout(() => { s.idx++; flowCard(); }, t2 + Math.min(4000, (w.mem || '').length * 25));
    }, t1);
  }
  function flowGo(d){ const s = session; s.idx = Math.max(0, Math.min(s.q.length, s.idx + d)); flowCard(); }
  // 暂停：停在当前词并直接亮出答案；继续：进入下一个
  function flowToggle(){
    const s = session; if (!s || !s.flow || s.idx >= s.q.length) return;
    s.paused = !s.paused;
    if (s.paused) flowCard(); else { s.idx++; flowCard(); }
  }
  function flowKnow(){
    const s = session, w = s.q[s.idx]; if (!w) return;
    known.add(w.w); store.set('cet6-known', [...known]); updateKnown();
    s.q.splice(s.idx, 1); flowCard();
  }
  function startStudy(){
    const due = dueList().sort((a,b) => srs[a].due - srs[b].due).map(w => byWord.get(w));
    const quota = Math.max(0, plan.daily - newToday());
    // 级别选「全部」时跳过中学基础词（a、about…），直接从四六级词开始
    const fresh = pool().filter(w => !srs[w.w] && (st.lv !== 'all' || w.lv !== 'basic')).slice(0, quota);
    // 交错：每 3 个复习词插 1 个新词，避免一口气全是新词
    const q = []; let i = 0, j = 0;
    while (i < due.length || j < fresh.length) {
      for (let k = 0; k < 3 && i < due.length; k++) q.push({w: due[i++], isNew: false});
      if (j < fresh.length) q.push({w: fresh[j++], isNew: true});
    }
    if (!q.length) { fc.innerHTML = `<div class="done-big">今天的任务完成了</div><p class="fc-sub">没有到期的复习词，今天的新词额度也用完了。可以去「自测」再巩固一下。</p>`; return; }
    session = {q, idx: 0, total: q.length, done: 0, shown: false};
    showCard();
  }
  function showCard(){
    const s = session; if (!s) return;
    if (s.idx >= s.q.length) {
      const t = s.tally || [0, 0, 0, 0];
      const hardN = hardWords().length;
      fc.innerHTML = `<div class="done-big">本轮完成</div>
        <p class="fc-sub">共 ${s.total} 个词：记得 <b>${t[2]}</b> · 太简单 <b>${t[3]}</b> · 模糊 <b>${t[1]}</b> · 忘了 <b>${t[0]}</b>（忘了的已在本轮补考）</p>
        <p class="fc-sub">${sk2()} 明天再来，到期的词会自动出现。</p>
        <div class="fc-acts"><button class="primary" id="again2">再来一轮</button>${hardN ? `<button id="hard2">专攻易忘词（${hardN}）</button>` : ''}</div>`;
      const h2 = $('#hard2'); if (h2) h2.onclick = startHard;
      $('#again2').onclick = startStudy; $('#ovBar').style.width = '100%'; return;
    }
    const it = s.q[s.idx], w = it.w;
    s.shown = false;
    $('#ovMeta').textContent = `第 ${s.idx + 1} / ${s.q.length} 个 · ${it.isNew ? '新词' : '复习'} · ${LV[w.lv]} · 真题 ${w.n} 次`;
    $('#ovBar').style.width = (s.idx / s.q.length * 100) + '%';
    fc.innerHTML = `<div class="fc-word">${esc(w.w)}</div>
      <div class="fc-sub">先在心里说出意思，再看答案</div>
      <div class="fc-pic" id="fcHint"></div>
      <div class="fc-acts"><button id="hintB">提示<span class="kh">（H）</span></button><button id="spkB">朗读<span class="kh">（S）</span></button><button class="primary" id="showB">看答案<span class="kh">（空格）</span></button></div>
      <div class="swipe-help">也可以直接轻点卡片看答案</div>`;
    $('#hintB').onclick = () => { $('#fcHint').innerHTML = w.parts ? `<div class="in" style="display:flex;justify-content:center">${partsHtml(w, {noResult: true})}</div>` : '<div class="fc-sub">这个词没有词根拆解，看看首字母和长度：' + esc(w.w[0]) + ' · ' + w.w.length + ' 个字母</div>'; };
    $('#spkB').onclick = () => speak(w.w);
    $('#showB').onclick = reveal;
  }
  function reveal(){
    const s = session; if (!s || s.shown) return;
    s.shown = true;
    const w = s.q[s.idx].w;
    fc.innerHTML = `<div class="fc-word">${esc(w.w)}</div>${backHtml(w)}
      <div class="fc-acts"><button class="again" data-g="0">忘了<small>1</small></button><button class="hard" data-g="1">模糊<small>2</small></button>
      <button class="good" data-g="2">记得<small>3</small></button><button class="easy" data-g="3">太简单<small>4</small></button></div>
      <div class="swipe-help">← 左滑 = 忘了 · 右滑 = 记得 →</div>`;
    fc.querySelectorAll('[data-g]').forEach(b => b.onclick = () => rate(+b.dataset.g));
    speak(w.w);
  }
  function rate(g){
    const s = session; if (!s || !s.shown) return;
    buzz(g === 0 ? [18, 40, 18] : 12);
    const it = s.q[s.idx];
    if (it.isNew && !srs[it.w.w]) bumpNew();
    grade(it.w.w, g);
    s.tally = s.tally || [0, 0, 0, 0]; s.tally[g]++;
    if (g === 0) s.q.splice(Math.min(s.q.length, s.idx + 5), 0, {w: it.w, isNew: false}); // 5 个词后再考一次
    s.idx++; showCard();
  }

  /* =====================================================================
     自测：看词选义 / 看义拼词 / 听音辨义
     ===================================================================== */
  function quizHome(){
    openOv('自测'); $('#ovMeta').textContent = ''; $('#ovBar').style.width = '0';
    const n = pool().length;
    fc.innerHTML = `<div class="done-big">选一种自测方式</div>
      <p class="fc-sub">题目从当前列表抽 20 个（${esc($('#resinfo').textContent)}，不含已掌握${st.lv === 'all' ? '，跳过中学基础词' : ''}）。答错的词会自动加入背诵复习。</p>
      <div class="modes">
        <button class="mode" data-m="pick"><b>看词选义</b><span>看英文，四选一中文</span></button>
        <button class="mode" data-m="spell"><b>看义拼词</b><span>看中文和词根提示，拼出单词</span></button>
        <button class="mode" data-m="listen"><b>听音辨义</b><span>只听发音，四选一（练听力反应）</span></button>
        <button class="mode" data-m="vs"><b>易混辨析</b><span>看中文，从形近词里挑出对的那个（affect / effect）</span></button>
      </div>${n < 4 ? '<p class="fc-sub" style="margin-top:16px">当前列表的词太少，先放宽筛选条件。</p>' : ''}`;
    fc.querySelectorAll('[data-m]').forEach(b => b.onclick = () => startQuiz(b.dataset.m));
  }
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const firstMean = w => w.zh.map(([p,t]) => (p ? p + ' ' : '') + t).join('；');
  // 易混词：从 vs 字段里取出词表中真实存在的形近词
  // 意思相同的拼写变体（fiber / fibre）不能当选择题
  const sameMeaning = (a, b) => firstMean(a).split(/[；;]/)[0] === firstMean(b).split(/[；;]/)[0];
  // 只要有一个义项相同（huge 巨大的 / enormous 巨大的；庞大的），放一起出题就会有两个正确答案
  const senseSetCache = new Map();
  const senseSet = w => { let s = senseSetCache.get(w); if (!s) { s = new Set(sensesOf(w).map(x => x.s)); senseSetCache.set(w, s); } return s; };
  const sharesSense = (a, b) => { const sb = senseSet(b); for (const s of senseSet(a)) if (sb.has(s)) return true; return sameMeaning(a, b); };
  // 易混词 = 卡片「易混」里的词 + 同一组串记里的词
  // 干扰项只取易混说明里每一段开头的词头（advise v. 建议 → advise），不取例句里顺带的词（read aloud 的 read、every day 的 day）
  const vsHeads = vs => vs.split(/[；;/、]/).map(s => (s.match(/^\s*([a-z][a-z-]+)(?=\s*(?:[^a-z\s]|(?:n|v|vt|vi|adj|adv|prep|conj)\.|$))/) || [])[1]).filter(Boolean);
  const rivalsOf = w => [...new Set([...vsHeads(w.vs || ''), ...((STORY_OF.get(w.w) || {}).ws || [])]
    .filter(x => x !== w.w && byWord.has(x)))].map(x => byWord.get(x)).filter(x => !sharesSense(w, x));
  function startQuiz(mode){
    let p = pool();
    // 同背诵：级别选「全部」时不考中学基础词（print、lock 这类太简单）
    if (st.lv === 'all') { const q = p.filter(w => w.lv !== 'basic'); if (q.length >= 4) p = q; }
    if (mode === 'vs') { p = p.filter(w => rivalsOf(w).length); if (p.length < 4) p = words.filter(w => rivalsOf(w).length); }
    if (p.length < 4) return;
    session = {quiz: mode, q: shuffle(p.slice()).slice(0, 20), idx: 0, right: 0, wrongs: []};
    quizCard();
  }
  function quizCard(){
    const s = session;
    if (s.idx >= s.q.length) {
      fc.innerHTML = `<div class="done-big">得分 ${s.right} / ${s.q.length}</div>
        ${s.wrongs.length ? `<p class="fc-sub">答错的词（已加入背诵复习）：</p><div class="fc-back">${s.wrongs.map(w => `<div style="margin:4px 0"><b>${esc(w.w)}</b>　${esc(firstMean(w))}</div>`).join('')}</div>` : '<p class="fc-sub">全对！</p>'}
        <div class="fc-acts"><button class="primary" id="qAgain">再测一组</button><button id="qHome">换个方式</button></div>`;
      $('#qAgain').onclick = () => startQuiz(s.quiz); $('#qHome').onclick = quizHome; $('#ovBar').style.width = '100%'; return;
    }
    const w = s.q[s.idx];
    $('#ovMeta').textContent = `第 ${s.idx + 1} / ${s.q.length} 题 · 已答对 ${s.right}`;
    $('#ovBar').style.width = (s.idx / s.q.length * 100) + '%';
    s.answered = false;
    if (s.quiz === 'spell') {
      const hint = w.parts ? w.parts.map(([a,b]) => b).join(' + ') : '';
      fc.innerHTML = `<div class="fc-back" style="text-align:center">${meanHtml(w)}${hint ? `<div class="fc-sub">词根提示：${esc(hint)}</div>` : ''}</div>
        <div class="fc-sub" style="margin-top:12px">共 ${w.w.length} 个字母：<b id="spMask" style="font:600 20px Georgia,serif;letter-spacing:4px">${esc(w.w[0])}${'_'.repeat(w.w.length - 1)}</b></div>
        <div class="spell"><input id="spIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="输入单词后回车"><button class="cta ghost" id="spHint" type="button" title="多显示一个字母">再给一个字母</button></div>
        <div id="spRes"></div>`;
      const inp = $('#spIn'); inp.focus();
      let shownN = 1;
      $('#spHint').onclick = () => {
        if (s.answered || shownN >= w.w.length - 1) return;   // 至少留最后一个字母自己拼
        shownN++; s.hinted = true;
        $('#spMask').textContent = w.w.slice(0, shownN) + '_'.repeat(w.w.length - shownN);
        inp.focus();
      };
      inp.onkeydown = e => { if (e.key === 'Enter') { e.stopPropagation(); s.answered ? next() : check(); } };
      function check(){
        s.answered = true;
        const typed = inp.value.trim().toLowerCase();
        // 英美另一种拼法（colour / color、practise / practice）也算对
        const isAlt = typed !== w.w && ALIAS[typed] === w.w;
        const ok = typed === w.w || isAlt;
        buzz(ok ? 12 : [25, 50, 25]);
        inp.classList.add(ok ? 'right' : 'wrong'); inp.readOnly = true;
        // 靠提示才拼出来的算「模糊」：计入复习，但不算完全记住
        if (ok && s.hinted) { s.right++; grade(w.w, 1); } else mark(w, ok);
        s.hinted = false;
        $('#spRes').innerHTML = `${ok ? '' : `<div class="fc-word" style="font-size:34px">${esc(w.w)}</div>`}${isAlt ? `<div class="fc-sub">也对：${esc(typed)} 是另一种拼法，本词表以 <b>${esc(w.w)}</b> 为准</div>` : ''}${backHtml(w)}<div class="fc-acts"><button class="primary" id="nx">下一题<span class="kh">（Enter）</span></button></div>`;
        $('#nx').onclick = next; speak(w.w);
        if (ok) autoNext(1800);
      }
      return;
    }
    const isVs = s.quiz === 'vs';
    // 干扰项优先同词性、同级别，不能只看词性就猜出答案
    const pos0 = x => (x.zh[0] && x.zh[0][0] || '').split('/')[0].replace(/^v[ti]\.$/, 'v.');
    const pool3 = (cond) => shuffle(words.filter(x => x !== w && cond(x) && !sharesSense(w, x)));
    let others = isVs ? rivalsOf(w).slice(0, 3) : pool3(x => pos0(x) === pos0(w) && x.lv === w.lv).slice(0, 3);
    if (!isVs && others.length < 3) others = others.concat(pool3(x => pos0(x) === pos0(w) && !others.includes(x))).slice(0, 3);
    if (!isVs && others.length < 3) others = others.concat(pool3(x => !others.includes(x))).slice(0, 3);
    const opts = shuffle([w, ...others]);
    const isListen = s.quiz === 'listen';
    const head = isListen ? `<div class="fc-word" style="font-size:60px;cursor:pointer" id="lsn" title="再听一遍"><span style="display:inline-block;width:64px;height:64px">${ICON_SPK}</span></div><div class="fc-sub">点喇叭或按 S 再听一遍</div>`
      : isVs ? `<div class="fc-back" style="text-align:center">${meanHtml(w)}</div><div class="fc-sub" style="margin-top:10px">哪个单词是这个意思？</div>`
      : `<div class="fc-word">${esc(w.w)}</div>`;
    fc.innerHTML = `${head}
      <div class="opts">${opts.map((o, i) => `<button class="opt" data-i="${i}" ${isVs ? 'style="font:600 20px Georgia,serif;text-align:center"' : ''}>${i + 1}. ${esc(isVs ? o.w : firstMean(o))}</button>`).join('')}</div><div id="qRes"></div>`;
    if (isListen) { speak(w.w); $('#lsn').onclick = () => speak(w.w); }
    fc.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(+b.dataset.i));
    s.choose = choose;
    function choose(i){
      if (s.answered) return; s.answered = true;
      const ok = opts[i] === w;
      buzz(ok ? 12 : [25, 50, 25]);
      fc.querySelectorAll('.opt').forEach((b, k) => { if (opts[k] === w) b.classList.add('right'); else if (k === i) b.classList.add('wrong'); });
      mark(w, ok);
      const vsExplain = isVs ? `<div class="fc-back">${opts.map(o => `<div style="margin:3px 0"><b style="font-family:Georgia,serif">${esc(o.w)}</b>　${esc(firstMean(o))}</div>`).join('')}${w.mem ? `<div class="mem">${memHtml(w.mem)}</div>` : ''}${storyHtml(w, false)}</div>` : '';
      $('#qRes').innerHTML = `${isListen ? `<div class="fc-word" style="font-size:34px">${esc(w.w)}</div>` : ''}${isVs ? vsExplain : (ok ? '' : backHtml(w))}<div class="fc-acts"><button class="primary" id="nx">下一题<span class="kh">（Enter）</span></button></div>`;
      $('#nx').onclick = next; if (!isListen) speak(w.w);
      if (ok) autoNext(isVs ? 2600 : 1200);
    }
  }
  function mark(w, ok){
    const s = session;
    if (ok) { s.right++; logReview(); } else { s.wrongs.push(w); grade(w.w, 0); }
  }
  function next(){ clearTimeout(session.autoT); session.idx++; quizCard(); }
  // 答对了自动进下一题（按钮下方走一条进度条）；点卡片任意处就停住，方便细看解析
  function autoNext(ms){
    const s = session; clearTimeout(s.autoT);
    const b = $('#nx'); if (b) { b.classList.add('auto'); b.style.setProperty('--auto', ms + 'ms'); }
    const cancel = e => { if (e.target.closest && e.target.closest('#nx')) return; clearTimeout(s.autoT); if (b) b.classList.remove('auto'); fc.removeEventListener('pointerdown', cancel); };
    fc.addEventListener('pointerdown', cancel);
    s.autoT = setTimeout(() => { fc.removeEventListener('pointerdown', cancel); if (session === s && s.answered) next(); }, ms);
  }

  addEventListener('keydown', e => {
    if (!ov.classList.contains('show')) return;
    if (e.key === 'Escape') { closeOv(); return; }
    if (e.target.tagName === 'INPUT') return;
    const s = session;
    if (!s) { if (e.key === 'Enter' && $('#goStudy')) { e.preventDefault(); startStudy(); } return; }
    if (s.flow) {
      if (e.key === ' ') { e.preventDefault(); flowToggle(); }
      else if (e.key === 'ArrowRight') flowGo(1);
      else if (e.key === 'ArrowLeft') flowGo(-1);
      else if (e.key.toLowerCase() === 'k') flowKnow();
      else if (e.key.toLowerCase() === 's') speak(s.q[Math.min(s.idx, s.q.length - 1)].w);
      return;
    }
    if (s.quiz) {
      if (s.answered && e.key === 'Enter') { e.preventDefault(); next(); }
      else if (!s.answered && /^[1-4]$/.test(e.key) && s.choose) s.choose(+e.key - 1);
      else if (e.key.toLowerCase() === 's' && s.quiz === 'listen') speak(s.q[s.idx].w);
      return;
    }
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!s.shown) reveal(); else if (s.idx >= s.q.length) startStudy(); }
    else if (s.shown && /^[1-4]$/.test(e.key)) rate(+e.key - 1);
    else if (!s.shown && e.key.toLowerCase() === 'h') $('#hintB') && $('#hintB').click();
    else if (e.key.toLowerCase() === 's') speak(s.q[Math.min(s.idx, s.q.length - 1)].w.w);
  });
  $('#studyBtn').onclick = studyHome;
  $('#quizBtn').onclick = quizHome;

  /* 「安装到手机桌面」：只有浏览器说能装时才出现（安卓 Chrome、电脑 Chrome/Edge）；已经当 App 打开、或装好了就隐藏 */
  (() => {
    const btn = $('#installBtn'); if (!btn) return;
    const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    if (standalone) return;
    let ev = null;
    addEventListener('beforeinstallprompt', e => { e.preventDefault(); ev = e; btn.hidden = false; });
    btn.onclick = async () => { if (!ev) return; ev.prompt(); try { await ev.userChoice; } catch (e) {} ev = null; btn.hidden = true; };
    addEventListener('appinstalled', () => { btn.hidden = true; ev = null; });
  })();

  /* 背诵卡手势：轻点卡片 = 看答案；看完答案后左滑 = 忘了、右滑 = 记得。卡片跟着手指走，松手飞出去
     快速过词：左滑 = 下一个、右滑 = 上一个，轻点 = 暂停 / 继续 */
  (() => {
    const reciting = () => session && !session.quiz && !session.flow && session.q && session.idx < session.q.length;
    const flowing = () => session && session.flow && session.idx < session.q.length;
    let sx = 0, sy = 0, dx = 0, dy = 0, pid = null, horiz = false;
    const reset = () => { fc.classList.remove('dragging'); fc.style.transform = ''; fc.dataset.dir = ''; };
    fc.addEventListener('pointerdown', e => {
      if (!(reciting() || flowing()) || e.button > 0 || e.target.closest('button,a,input,.blk,.anim-btn')) return;
      sx = e.clientX; sy = e.clientY; dx = dy = 0; pid = e.pointerId; horiz = false;
    });
    fc.addEventListener('pointermove', e => {
      if (e.pointerId !== pid || !session) return;
      if (flowing()) {
        dx = e.clientX - sx; dy = e.clientY - sy;
        if (!horiz && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.2) horiz = true;
        if (!horiz) return;
        fc.classList.add('dragging'); fc.classList.remove('settle');
        fc.style.transform = `translateX(${dx}px)`;
        fc.dataset.dir = dx < -70 ? 'next' : dx > 70 ? 'prev' : '';
        return;
      }
      if (!session.shown) return;
      dx = e.clientX - sx; dy = e.clientY - sy;
      if (!horiz && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.2) horiz = true;   // 横向拖才算，竖着划照常滚动
      if (!horiz) return;
      fc.classList.add('dragging'); fc.classList.remove('settle');
      fc.style.transform = `translateX(${dx}px) rotate(${dx / 28}deg)`;
      fc.dataset.dir = dx < -70 ? 'L' : dx > 70 ? 'R' : '';
    });
    const up = e => {
      if (e.pointerId !== pid) return; pid = null;
      const moved = Math.abs(e.clientX - sx) > 8 || Math.abs(e.clientY - sy) > 8;
      if (flowing()) {
        if (!moved) { reset(); flowToggle(); return; }
        if (horiz && Math.abs(dx) > 90) {
          const d = dx < 0 ? 1 : -1; buzz(10);
          fc.classList.remove('dragging'); fc.classList.add(dx < 0 ? 'flyL' : 'flyR');
          setTimeout(() => { fc.classList.remove('flyL', 'flyR'); reset(); flowGo(d); }, 200);
        } else if (horiz) { fc.classList.remove('dragging'); fc.classList.add('settle'); fc.style.transform = ''; fc.dataset.dir = ''; setTimeout(() => fc.classList.remove('settle'), 260); }
        return;
      }
      if (!reciting()) { reset(); return; }
      if (!session.shown) { if (!moved) reveal(); return; }
      if (horiz && Math.abs(dx) > 90) {
        const g = dx < 0 ? 0 : 2;
        fc.classList.remove('dragging'); fc.classList.add(dx < 0 ? 'flyL' : 'flyR');
        setTimeout(() => { fc.classList.remove('flyL', 'flyR'); reset(); rate(g); }, 210);
      } else if (horiz) { fc.classList.remove('dragging'); fc.classList.add('settle'); fc.style.transform = ''; fc.dataset.dir = ''; setTimeout(() => fc.classList.remove('settle'), 260); }
    };
    fc.addEventListener('pointerup', up);
    fc.addEventListener('pointercancel', e => { if (e.pointerId === pid) { pid = null; reset(); } });
  })();

  /* =====================================================================
     导出 PDF：把当前列表（全部，不分页加载）排成紧凑的双栏打印版，
     再调用浏览器打印 → 选「另存为 PDF」。?print=alpha|freq|write 可直接生成。
     ===================================================================== */
  function partsText(w){ return w.parts ? w.parts.map(([a,b]) => `${a}(${b})`).join(' + ') : ''; }
  function buildPrint(list, title){
    const pa = $('#printArea');
    const groupBy = st.sort === 'alpha' || (st.sort === 'write' && !st.wfreq);
    let html = `<div class="p-head"><h1>${esc(title)}</h1><p>${esc($('#resinfo').textContent)} · 近六年 ${(meta.sittings||[]).length} 次六级真题词频 · 生成于 ${new Date().toLocaleDateString('zh-CN')}</p>
      <p class="p-key">级别：基 = 基础　四 = 四级　六 = 六级　超 = 超纲　｜　数字 = 近六年真题出现次数　｜　★ = 高频 / 必考　｜　✎ = 会写词　｜　僻 = 熟词僻义</p></div><div class="p-cols">`;
    let g = null;
    const LVS = {basic:'基', cet4:'四', cet6:'六', ext:'超'};
    for (const w of list) {
      if (groupBy && w.w[0] !== g) { g = w.w[0]; html += `<h2 class="p-g">${g.toUpperCase()}</h2>`; }
      const pt = partsText(w);
      html += `<div class="p-e"><div class="p-l"><b>${esc(w.w)}</b><span class="p-lv">${LVS[w.lv]}</span>${w.n ? `<span class="p-n">${w.n}</span>` : ''}${w.b >= 3 ? '<span class="p-s">★</span>' : ''}${w.wr ? '<span class="p-s">✎</span>' : ''}${w.rs ? '<span class="p-s">僻</span>' : ''}</div>
        <div class="p-z">${w.zh.map(([p,t]) => `${p ? `<i>${esc(p)}</i> ` : ''}${esc(t)}`).join('　')}</div>
        ${pt ? `<div class="p-p">${esc(pt)}</div>` : ''}${w.mem ? `<div class="p-m">${memHtml(w.mem)}</div>` : ''}${w.vs ? `<div class="p-m">易混：${esc(w.vs)}</div>` : ''}${STORY_OF.has(w.w) ? `<div class="p-m">串记：${memHtml(STORY_OF.get(w.w).t)}</div>` : ''}</div>`;
    }
    pa.innerHTML = html + '</div>';
  }
  function exportPdf(auto){
    if (CET6.extraUrl && !CET6.extraLoaded) { alert('助记数据还在加载，稍等一两秒再导出 PDF。'); return; }
    const titles = {alpha: '六级 8000 词 · 字母版', freq: '六级 8000 词 · 真题频率版', write: '六级会写词汇'};
    buildPrint(current, titles[st.sort] || '六级 8000 词');
    document.title = (titles[st.sort] || '六级8000词').replace(/\s/g, '');
    if (!auto) setTimeout(() => { print(); document.title = '六级 8000 词'; }, 60);
  }
  const pq = new URLSearchParams(location.search).get('print');
  if (pq) { st.sort = pq; st.lv = 'all'; st.band = 'all'; st.letter = 'all'; st.hideKnown = false; st.wfreq = false; }

  renderStats(); buildControls(); apply(); legend(); updateDue();
  if (pq) { exportPdf(true); document.documentElement.classList.add('auto-print'); }
  // 第二步：列表先显示出来，再在后台补上助记、易混词、逐年次数和串记段子
  if (CET6.extraUrl) {
    CET6.extra = (list, stories) => {
      list.forEach((x, i) => { const w = words[i]; if (!w || !x) return; w.mem = x[0] || ''; w.vs = x[1] || ''; w.y = x[2] || w.y; w.pt = x[3] || w.pt; w.wt = (w.pt[2] || 0) + (w.pt[3] || 0); });
      CET6.storyList = stories || []; indexStories(); CET6.extraLoaded = true;
      // 已经显示出来的卡片原地换成完整版（不打乱滚动位置）；串记视图要等段子到了才能画
      if (st.sort === 'stories') apply();
      else document.querySelectorAll('#list .card').forEach(c => { const w = byWord.get(c.dataset.w); if (w) c.outerHTML = card(w); });
    };
    const sc = document.createElement('script'); sc.src = CET6.extraUrl; sc.async = true; document.head.appendChild(sc);
  }
})();
</script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
